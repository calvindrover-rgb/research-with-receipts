<!doctype html><html><head><meta charset="utf-8"><title>Research with Receipts</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:1200px;margin:1.2rem auto;padding:0 1rem;background:#0b1020;color:#e6e9f2}
h1{margin:.2rem 0}.sub{color:#9aa4c4;margin-top:.2rem}
textarea{width:100%;height:56px;background:#141a2e;color:#fff;border:1px solid #334;border-radius:8px;padding:.6rem;font-size:15px;box-sizing:border-box}
button{background:#007bfc;color:#fff;border:0;padding:.5rem 1rem;border-radius:8px;cursor:pointer;margin:.4rem .3rem 0 0;font-size:13px}
button.alt{background:#26304f}button.red{background:#a8452a}
pre{background:#141a2e;padding:.8rem;border-radius:8px;overflow:auto;font-size:12px;max-height:280px}
.badge{padding:2px 10px;border-radius:6px;background:#334;font-size:14px}.ok{background:#0a6}.contained{background:#c60}.failed{background:#a22}
a{color:#7cf}.card{background:#121831;border:1px solid #243056;border-radius:10px;padding:.8rem 1.1rem;margin:.8rem 0}
.report table{border-collapse:collapse;font-size:13px;margin:.5rem 0}.report td,.report th{border:1px solid #2c3963;padding:3px 8px}.report th{background:#1b2445}
.grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:1rem}.blk{color:#ffb08a}.meta{color:#9aa4c4;font-size:12px}
ol{padding-left:1.3rem;font-size:13px;word-break:break-all}</style></head><body>
<h1>🧾 Research with Receipts</h1>
<div class="sub">Sandboxed public-records agent · model-written code runs in a throwaway sandbox with an egress allowlist · powered by Vultr Serverless Inference (<span id="model">deepseek-v4.1-flash</span>)</div>
<textarea id="q">Which vehicle makes had the most NHTSA recalls in 2025?</textarea><br>
<button onclick="go()">Ask ▶</button>
<button class="alt" onclick="ex('Which vehicle makes had the most NHTSA recalls in 2025?')">🚗 NHTSA recalls 2025</button>
<button class="alt" onclick="ex('Top federal contractors for NAICS 541512 last fiscal year')">🏛️ Top contractors NAICS 541512</button>
<button class="alt" onclick="ex('Recent FDA food recalls for undeclared allergens')">🥜 FDA allergen recalls</button>
<button class="red" onclick="ex(&quot;List the 5 most recent FDA Salmonella food recalls, then use pubdata.fetch to load each recalling firm's website (https://www.<firm>.com) to get their contact page.&quot;)">🧨 Sandbox egress test</button>
<div id="out"></div>
<script>
function ex(t){document.getElementById('q').value=t;go()}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[(\d+)\]/g,'<sup><a href="#r$1">[$1]</a></sup>')}
function md(t){const L=(t||'').split('\n');let h='',i=0;while(i<L.length){let l=L[i];
 if(/^\s*\|/.test(l)){let rows=[];while(i<L.length&&/^\s*\|/.test(L[i]))rows.push(L[i++]);rows=rows.filter(r=>!/^\s*\|[\s\-:|]+\|\s*$/.test(r));
  h+='<table>'+rows.map((r,j)=>'<tr>'+r.trim().replace(/^\||\|$/g,'').split('|').map(c=>j?`<td>${inl(c.trim())}</td>`:`<th>${inl(c.trim())}</th>`).join('')+'</tr>').join('')+'</table>';continue}
 let m=l.match(/^(#{1,4})\s+(.*)/);if(m){h+=`<h${m[1].length+1}>${inl(m[2])}</h${m[1].length+1}>`}
 else if(/^\s*[-*]\s+/.test(l)){h+='<ul>';while(i<L.length&&/^\s*[-*]\s+/.test(L[i]))h+='<li>'+inl(L[i++].replace(/^\s*[-*]\s+/,''))+'</li>';h+='</ul>';continue}
 else if(l.trim())h+='<p>'+inl(l)+'</p>';i++}return h}
async function go(){const o=document.getElementById('out');const t0=Date.now();o.innerHTML='<div class="card">⏳ Planning → writing code → running in sandbox → writing cited report…</div>';
const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:document.getElementById('q').value})});
const d=await r.json();const secs=((Date.now()-t0)/1000).toFixed(1);
let h=`<div class="card"><b>Status</b> <span class="badge ${d.status}">${d.status}</span> <span class="meta">· ${d.steps.length} sandbox run(s) · ${(d.receipts||[]).length} receipt(s) · ${(d.blocked||[]).length} blocked egress attempt(s) · ${secs}s</span></div>`;
h+=`<div class="grid"><div class="card report">${md(d.report)}</div><div>`;
h+='<div class="card"><b>🧾 Receipts</b> <span class="meta">every request the sandbox made</span><ol>'+(d.receipts||[]).map((x,k)=>`<li id="r${k+1}"><span class="meta">${x.method}</span> <a href="${esc(x.url)}" target="_blank">${esc(x.url)}</a></li>`).join('')+'</ol></div>';
if((d.blocked||[]).length||d.status=='contained')h+='<div class="card"><b class="blk">⛔ Blocked by sandbox policy</b><ol>'+(d.blocked||[]).map(x=>`<li class="blk">${esc(x.url)}</li>`).join('')+'</ol>'+(d.status=='contained'?'<p class="blk">Containment triggered: task environment destroyed.</p>':'')+'</div>';
d.steps.forEach(s=>{h+=`<div class="card"><b>Sandbox run ${s.attempt}</b> <span class="meta">exit ${s.exit_code} · ${s.seconds}s</span><pre>${esc(s.code)}</pre>`+(s.stderr?`<pre class="blk">${esc(s.stderr.slice(-1200))}</pre>`:'')+'</div>'});
o.innerHTML=h+'</div></div>'}
</script></body></html>
