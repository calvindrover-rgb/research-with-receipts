services:
  sandbox-image:            # builds the throwaway sandbox image; exits immediately
    build: ./sandbox
    image: pra-sandbox:latest
    entrypoint: ["true"]
  egress-proxy:
    build: { context: ./proxy, dockerfile_inline: "FROM python:3.12-slim\nCOPY proxy.py /p.py\nCMD [\"python\",\"/p.py\"]" }
    environment:
      ALLOW_HOSTS: api.fda.gov,api.nhtsa.gov,efts.sec.gov,data.sec.gov,api.usaspending.gov,www.federalregister.gov,geocoding.geo.census.gov,data-api.ecb.europa.eu
    networks: [sandbox_net, default]
  web:
    build: .
    ports: ["8000:8000"]
    environment:
      SANDBOX_MODE: docker
      SANDBOX_NETWORK: pra_sandbox_net
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.vultrinference.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4.1-flash}
      LLM_API_KEY: ${LLM_API_KEY:-}     # stays in control plane; never passed into sandbox
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    depends_on: [egress-proxy, sandbox-image]
networks:
  sandbox_net:
    name: pra_sandbox_net          # fixed name so `docker run --network` matches from any directory
    internal: true                 # no internet route; only egress-proxy bridges out
